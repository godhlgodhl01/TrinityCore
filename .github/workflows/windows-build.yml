name: Cataclysm 4.3.4 Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (Boost, MySQL, OpenSSL via vcpkg)
        run: |
          choco install boost-msvc-14.3 mysql --no-progress -y
          # 내장된 vcpkg로 헤더와 .lib, .dll이 완벽히 포함된 OpenSSL x64 설치
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows
        shell: pwsh

      - name: Configure CMake
        run: |
          $boostDir = (Get-ChildItem "C:\local" -Filter "boost_*" | Select-Object -First 1).FullName
          $mysqlDir = (Get-ChildItem "C:\Program Files\MySQL" -Filter "MySQL Server *" | Select-Object -First 1).FullName
          $opensslDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"

          mkdir build
          cd build
          cmake .. -A x64 `
            -DBOOST_ROOT="$boostDir" `
            -DBoost_COMPILER="-vc143" `
            -DMYSQL_INCLUDE_DIR="$mysqlDir\include" `
            -DMYSQL_LIBRARY="$mysqlDir\lib\libmysql.lib" `
            -DOPENSSL_ROOT_DIR="$opensslDir" `
            -DTOOLS=1 `
            -DSERVERS=1 `
            -DSCRIPTS=static `
            -DUSE_COREPCH=1 `
            -DUSE_SCRIPTPCH=1 `
            -DWITH_WARNINGS=0 `
            -DBUILD_TESTING=0
        shell: pwsh

      - name: Build (Release)
        run: |
          cd build
          cmake --build . --config Release -- /m /p:CL_MPcount=4
        shell: pwsh

      - name: Package Binaries & DLLs
        run: |
          $mysqlDir = (Get-ChildItem "C:\Program Files\MySQL" -Filter "MySQL Server *" | Select-Object -First 1).FullName
          $opensslBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"

          New-Item -ItemType Directory -Force -Path "release_output"
          Copy-Item "build/bin/Release/*" -Destination "release_output" -Recurse -Force
          Copy-Item "$opensslBin\*.dll" -Destination "release_output" -Force
          Copy-Item "$mysqlDir\lib\libmysql.dll" -Destination "release_output" -Force
        shell: pwsh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-4.3.4-Win64
          path: release_output/
          retention-days: 7
