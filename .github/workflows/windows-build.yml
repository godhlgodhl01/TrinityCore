name: TrinityCore Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          choco install boost-msvc-14.3 mysql -y
          # OpenSSL 1.1.1 또는 3.x 환경 호환성을 위해 설치
          choco install openssl -y
        shell: pwsh

      - name: Configure CMake
        run: |
          $boostDir = (Get-ChildItem "C:\local" -Filter "boost_*" | Select-Object -First 1).FullName
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 `
            -DBOOST_ROOT="$boostDir" `
            -DTOOLS=1 `
            -DSERVERS=1 `
            -DSCRIPTS=static `
            -DUSE_COREPCH=1 `
            -DUSE_SCRIPTPCH=1 `
            -DWITH_WARNINGS=0 `
            -DBUILD_TESTING=0
        shell: pwsh

      - name: Build (Release)
        run: |
          cd build
          cmake --build . --config Release -j 4
        shell: pwsh

      - name: Package Binaries & DLLs
        run: |
          New-Item -ItemType Directory -Force -Path "release_output"
          # TrinityCore 기본 출력 폴더(build/bin/Release)에서 모든 exe 및 설정 파일 복사
          Copy-Item "build/bin/Release/*" -Destination "release_output" -Recurse -Force
          
          # 필수 DLL 복사 (OpenSSL, MySQL)
          Copy-Item "C:\Program Files\OpenSSL-Win64\bin\libcrypto-*.dll" -Destination "release_output" -ErrorAction SilentlyContinue
          Copy-Item "C:\Program Files\OpenSSL-Win64\bin\libssl-*.dll" -Destination "release_output" -ErrorAction SilentlyContinue
          Copy-Item "C:\Program Files\MySQL\MySQL Server *\lib\libmysql.dll" -Destination "release_output" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrinityCore-Win64
          path: release_output/
          retention-days: 7
